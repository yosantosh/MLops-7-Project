<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=3">
</head>

<body>
    <div class="container">
        <h1>Vehicle Insurance Response Prediction</h1>

        <div class="glass-card" style="padding: 0;">
            <div id="data-table-container" style="max-height: 60vh;">
                <!-- Table will be rendered here by JS -->
            </div>

            <div class="preview-actions" style="padding: 24px; border-top: 1px solid var(--panel-border);">
                <button id="add-row-btn" class="secondary-btn" style="padding: 12px 24px;">+ Add Row</button>
                <div style="flex:1"></div>
                <button id="predict-btn" class="submit-btn" style="width: auto; padding: 12px 32px;">Predict
                    All</button>
                <button id="download-btn" class="secondary-btn" style="display:none; margin-left: 12px;">Download
                    CSV</button>
            </div>
        </div>

        <div style="margin-top: 48px;">
            <button id="train-model-btn" class="secondary-btn" style="font-size: 0.9rem; padding: 12px 24px;">
                Admin: Train Model
            </button>
        </div>
    </div>

    <!-- Training Modal -->
    <div id="training-modal" class="training-modal">
        <div class="training-modal-content">
            <div class="training-modal-header">
                <h2>Model Training Logs</h2>
                <p>Running training pipeline...</p>
            </div>

            <div id="training-logs" class="training-logs">
                <div class="log-entry">Ready to start training...</div>
            </div>

            <button id="close-modal-btn" class="close-modal-btn">Close Console</button>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/batch.js') }}"></script>
</body>

</html>
