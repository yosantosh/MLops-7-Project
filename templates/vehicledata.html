<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Vehicle Insurance Response Prediction</h1>

        <div class="glass-form" style="margin-bottom:18px; text-align:left;">
            <label for="paste-area">Paste table from Excel (Ctrl+V) here:</label>
            <textarea id="paste-area" placeholder="Paste spreadsheet cells copied from Excel or Google Sheets" rows="4" style="width:100%; padding:12px; border-radius:8px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:#fff;"></textarea>
            <div id="paste-preview" style="margin-top:14px;"></div>
        </div>

        <!-- Manual form removed as per user request to focus on batch pasting -->
        <h2 style="font-size: 1.2rem; color: var(--muted); margin-bottom: 20px;">Paste Excel/Sheets Data for Batch Prediction</h2>

        <button id="train-model-btn" class="submit-btn" style="background-color: #4CAF50; margin-top: 10px;">Train Model</button>
        {% if context != "Rendering" %}
        <div class="result glass-card">
            <h2>Prediction Result</h2>
            <p>{{ context }}</p>
        </div>
        {% endif %}
    </div>

    <!-- Simple Training Modal -->
    <div id="training-modal" class="training-modal">
        <div class="training-modal-content">
            <div class="training-modal-header">
                <h2>Model Training Logs</h2>
                <p>Running demo.py...</p>
            </div>

            <div id="training-logs" class="training-logs" style="font-family: 'Courier New', monospace; font-size: 14px; color: #00ff88;">
                <div class="log-entry">Starting training...</div>
            </div>

            <button id="close-modal-btn" class="close-modal-btn">Close</button>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/batch.js') }}"></script>
</body>
</html>
