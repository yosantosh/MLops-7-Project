name: Deploy Docker image to aws EC2 instance.    # name of the workflow

on:                                       #when to trigger this cicd
  push:                                   # triger on git push event only
    branches: [main]                      #triger on main branch only


jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to aws ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag and push dcoker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "::set-output name=image::${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"


  # the docker is automatically deployed to the aws ec2 instance when test or ci passed thats why need: CI
  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted                      # runs on self hosted runner(aws ec2 server) instead of github runner server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to aws ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      
      - name: Clean previous images and containers
        run: |
          docker stop mlproj || true
          docker rm mlproj || true
          # Force kill any container occupying port 5000 (handles old/unnamed containers)
          docker ps -q --filter "publish=5000" | xargs -r docker stop
          docker ps -a -q --filter "publish=5000" | xargs -r docker rm

      - name: Run docker image to serve users
        run: |
          docker run -d -p 5000:5000 --name=mlproj -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" -e MONGODB_URL="${{ secrets.MONGODB_URL }}" "${{ steps.login-ecr.outputs.registry }}"/"${{ secrets.ECR_REPO }}":latest
          

                    